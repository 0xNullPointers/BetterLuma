name: Build and Release DLLs

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    name: Build and Release
    runs-on: windows-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Setup CMake
        uses: jwlawrence/actions-setup-cmake@v2
        with:
          cmake-version: '3.20.x'

      - name: Build LumaCore (Release)
        run: |
          .\build.bat --release-only --no-pause

      - name: Prepare Assets
        shell: bash
        run: |
          mkdir dist
          cp Releases/Release/LumaCore.dll dist/
          cp Releases/Release/dwmapi.dll dist/

      - name: Generate Version Tag
        id: tag
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "TAG_NAME=v${{ github.run_number }}" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.TAG_NAME }}
          files: |
            dist/LumaCore.dll
            dist/dwmapi.dll
          body: |
            Automated build for version ${{ steps.tag.outputs.TAG_NAME }}.
            
            Included files:
            - LumaCore.dll
            - dwmapi.dll (Proxy Loader)
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
